# Based on official specifications from fares.md, algorithm.md, and graph-structure.md

# === Routing Parameters ===

# Maximum walking distance from origin/destination to transit stops (meters)
# Source: algorithm.md section 4
routing.accessRadiusMeters=500

# Boarding penalty to discourage excessive transfers (seconds)
# Source: graph-structure.md section 3.2 - adds +120s perceived cost
routing.boardingPenaltySec=120

# Walk penalty multiplier - makes walking "feel" longer than riding
# Source: graph-structure.md section 3.2 - walk_sec � 1.5 + 30s
routing.walkPenaltyMultiplier=1.5
routing.walkPenaltyConstant=30

# Walking speed for distance/time calculations
# Source: graph-structure.md section 4 - 4.5 km/h = 1.25 m/s
routing.walkingSpeedMps=1.25

# Street factor for walking distance estimation
# Source: graph-structure.md section 2.3 - straight distance � 1.3
routing.walkStreetFactor=1.3

